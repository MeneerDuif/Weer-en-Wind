name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests en APK bouwen
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk artyweather.apk
      - uses: actions/upload-artifact@v4
        with:
          name: artyweather-apk
          path: artyweather.apk
      - name: Release met APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: artyweather 1.0.${{ github.run_number }}
          body: "Download **artyweather.apk** hieronder en open het op je telefoon."
          files: artyweather.apk
          make_latest: true
